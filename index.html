<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>🚗 3D Car Driving Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: fixed;
    top: 0; left: 0;
  }

  /* Speed badge (top-center) */
  .speed-badge {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    color: white;
    padding: 8px 18px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10;
    border: 1px solid rgba(99, 102, 241, 0.4);
  }
  .speed-badge .icon { font-size: 18px; }
  .speed-badge .num {
    font-size: 20px;
    font-weight: 800;
    color: #93c5fd;
    min-width: 30px;
    text-align: right;
  }
  .speed-badge .unit { font-size: 11px; opacity: 0.8; }

  /* Camera button (top-right) */
  .cam-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    right: 14px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    color: white;
    border: 1px solid rgba(99, 102, 241, 0.4);
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    z-index: 11;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cam-btn:active { transform: scale(0.95); }
  .cam-btn .cam-icon { font-size: 16px; }
  .cam-btn .cam-name { font-size: 11px; }

  /* Reset button (top-left) */
  .reset-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 14px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    color: white;
    border: 1px solid rgba(99, 102, 241, 0.4);
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    z-index: 11;
  }
  .reset-btn:active { transform: scale(0.95); }

  /* Controls container */
  .controls {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 14px);
    left: 0;
    right: 0;
    padding: 0 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;  /* Both wheel and pedals anchored to bottom */
    z-index: 10;
    pointer-events: none;
  }

  /* Pedals - round, side-by-side like Car Parking Multiplayer */
  .pedal {
    pointer-events: auto;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    border: 4px solid;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 800;
    color: white;
    transition: transform 0.08s;
    -webkit-user-select: none;
    user-select: none;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 -8px 16px rgba(0,0,0,0.3);
  }
  .pedal .lbl {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 2px;
    text-transform: uppercase;
  }
  .pedal.brake {
    background: rgba(239, 68, 68, 0.85);
    border-color: #ef4444;
  }
  .pedal.brake:active, .pedal.brake.pressed {
    background: rgba(239, 68, 68, 1);
    transform: scale(0.92);
  }
  .pedal.gas {
    background: rgba(16, 185, 129, 0.85);
    border-color: #10b981;
  }
  .pedal.gas:active, .pedal.gas.pressed {
    background: rgba(16, 185, 129, 1);
    transform: scale(0.92);
  }

  /* Pedals group (right side) */
  .pedals-group {
    pointer-events: auto;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  /* Steering wheel container - LEFT side like CPM */
  .wheel-wrap {
    pointer-events: auto;
    width: 200px;
    height: 200px;
    position: relative;
    touch-action: none;
  }
  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #475569, #1e293b 70%);
    border: 6px solid #0f172a;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.5);
    position: relative;
    transform: rotate(0deg);
    transition: transform 0.05s ease-out;
  }
  .wheel::before {
    content: '';
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #334155, #0f172a);
    border: 3px solid #1e293b;
  }
  /* Steering wheel spokes */
  .wheel::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 18px;
    right: 18px;
    height: 14px;
    background: linear-gradient(to bottom, #475569, #1e293b);
    transform: translateY(-50%);
    border-radius: 4px;
  }
  .wheel-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #64748b, #1e293b);
    border: 3px solid #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    z-index: 2;
  }
  /* Wheel rotation indicator (red stripe at top) */
  .wheel-marker {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 28px;
    background: #ef4444;
    border-radius: 4px;
    box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    z-index: 3;
  }

  /* Vertical spoke (top to center) */
  .wheel-vspoke {
    position: absolute;
    top: 18px;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    background: linear-gradient(to right, #475569, #1e293b);
    border-radius: 4px;
    z-index: 1;
  }

  /* Hint toast */
  .hint {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    color: white;
    padding: 14px 22px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    z-index: 20;
    border: 1px solid rgba(99, 102, 241, 0.5);
    pointer-events: none;
    transition: opacity 0.5s;
    max-width: 280px;
  }
  .hint.hide { opacity: 0; }
  .hint b { color: #93c5fd; }

  /* Compass / direction */
  .compass {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 60px);
    right: 14px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    color: white;
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 11px;
    font-weight: 700;
    z-index: 11;
    border: 1px solid rgba(99, 102, 241, 0.3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .compass .arrow { font-size: 14px; color: #fbbf24; }

  @media (max-width: 400px) {
    .pedal { width: 76px; height: 76px; font-size: 24px; }
    .wheel-wrap { width: 170px; height: 170px; }
  }
  @media (min-width: 800px) {
    .pedal { width: 100px; height: 100px; font-size: 30px; }
    .wheel-wrap { width: 220px; height: 220px; }
  }

  /* Garage button */
  .garage-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 60px);
    left: 14px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    color: white;
    border: 1px solid rgba(99, 102, 241, 0.4);
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    z-index: 11;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .garage-btn:active { transform: scale(0.95); }

  /* Garage overlay */
  .garage-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .garage-overlay.show { display: flex; }
  .garage-panel {
    background: #1e293b;
    border: 2px solid #4c1d95;
    border-radius: 18px;
    padding: 24px;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(76, 29, 149, 0.4);
  }
  .garage-title {
    font-size: 24px;
    font-weight: 800;
    color: #a78bfa;
    margin-bottom: 16px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .garage-section {
    margin-bottom: 20px;
  }
  .garage-section h3 {
    font-size: 13px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 700;
  }
  .car-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
  }
  .car-option {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 12px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .car-option:hover { border-color: #7c3aed; }
  .car-option.selected {
    background: linear-gradient(135deg, #4c1d95, #064e3b);
    border-color: #a78bfa;
  }
  .car-option .preview {
    width: 50px;
    height: 30px;
    margin: 0 auto 6px;
    border-radius: 6px;
    border: 2px solid #000;
    position: relative;
  }
  .car-option .preview::before {
    content: '';
    position: absolute;
    top: 4px; left: 8px; right: 8px;
    height: 8px;
    background: rgba(0,0,0,0.4);
    border-radius: 3px;
  }
  .car-option .name {
    font-size: 12px;
    color: white;
    font-weight: 700;
  }
  .car-option .stat {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 2px;
  }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 8px;
  }
  .color-option {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #334155;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .color-option:hover { transform: scale(1.1); }
  .color-option.selected {
    border-color: white;
    transform: scale(1.15);
  }
  .tuning-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .tuning-option {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .tuning-option:hover { border-color: #7c3aed; }
  .tuning-option.selected {
    background: linear-gradient(135deg, #4c1d95, #064e3b);
    border-color: #a78bfa;
  }
  .tuning-option .label {
    font-size: 12px;
    color: white;
    font-weight: 700;
  }
  .tuning-option .desc {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 4px;
  }
  .garage-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: center;
  }
  .garage-btn-action {
    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .garage-btn-action.green {
    background: linear-gradient(135deg, #10b981, #065f46);
  }
  .garage-btn-action:active { transform: scale(0.95); }
  .free-badge {
    display: inline-block;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #1f2937;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 800;
    margin-left: 8px;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Top UI -->
<div class="speed-badge">
  <span class="icon">⚡</span>
  <span class="num" id="speedNum">0</span>
  <span class="unit">mph</span>
</div>
<button class="reset-btn" onpointerdown="resetCar()">🔄 Reset</button>
<button class="garage-btn" onpointerdown="openGarage()">🏎️ Garage</button>
<button class="cam-btn" id="camBtn" onpointerdown="cycleCamera()">
  <span class="cam-icon">📷</span>
  <span class="cam-name" id="camName">Chase</span>
</button>
<div class="compass">
  <span class="arrow" id="compassArrow">⬆️</span>
  <span id="compassDir">N</span>
</div>

<!-- Hint -->
<div class="hint" id="hint">
  🚗 <b>Drive!</b> Drag the <b>wheel</b> (left) to steer<br>
  🛑 <b>Brake</b> + ⛽ <b>Gas</b> pedals on the right<br>
  📷 Tap <b>camera</b> button to change view
</div>

<!-- Controls: wheel LEFT, pedals (brake+gas) side-by-side RIGHT -->
<div class="controls">
  <div class="wheel-wrap" id="wheelWrap">
    <div class="wheel" id="wheel">
      <div class="wheel-marker"></div>
      <div class="wheel-vspoke"></div>
      <div class="wheel-center">🚗</div>
    </div>
  </div>
  <div class="pedals-group">
    <button class="pedal brake" id="brakeBtn">
      🛑<span class="lbl">BRAKE</span>
    </button>
    <button class="pedal gas" id="gasBtn">
      ⛽<span class="lbl">GAS</span>
    </button>
  </div>
</div>

<!-- Garage overlay -->
<div class="garage-overlay">
  <div class="garage-panel">
    <div class="garage-title">
      🏎️ Garage <span class="free-badge">ALL FREE</span>
    </div>

    <div class="garage-section">
      <h3>Choose your car <span class="free-badge">80+ CARS</span></h3>
      <input type="text" id="carSearch" placeholder="🔍 Search cars (e.g. honda, bmw, mustang, supra)..."
             style="width: 100%; padding: 10px 14px; border-radius: 10px; background: #0f172a; border: 2px solid #334155; color: white; font-size: 14px; margin-bottom: 12px; outline: none;"
             oninput="buildGarageUI()">
      <div class="car-grid" id="carGrid" style="max-height: 280px; overflow-y: auto; padding-right: 4px;"></div>
    </div>

    <div class="garage-section">
      <h3>Paint color</h3>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="garage-section">
      <h3>Tuning</h3>
      <div class="tuning-grid" id="tuningGrid"></div>
    </div>

    <div class="garage-actions">
      <button class="garage-btn-action green" onpointerdown="applyCar()">✅ Drive this car!</button>
      <button class="garage-btn-action" onpointerdown="closeGarage()">Cancel</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   3D CAR DRIVING GAME
   - Three.js for 3D rendering
   - Steering wheel (drag to rotate, returns to center)
   - Brake LEFT, Gas RIGHT pedals (side-by-side)
   - Multiple camera views (cycle with button)
   - Infinite world (objects respawn as car drives)
   ============================================================ */

const canvas = document.getElementById('canvas');

// ============== Three.js setup ==============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue
scene.fog = new THREE.Fog(0x87ceeb, 1500, 4000); // distant fog - see far away

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 8000);

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(80, 120, 50);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a5f0b, 0.4);
scene.add(hemi);

// ============== Ground (solid bright green - guaranteed visible) ==============
const GROUND_SIZE = 2000;
const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
// Use SOLID COLOR MeshBasicMaterial - no texture to load, no lighting needed
// This guarantees the ground is ALWAYS visible (previous texture sometimes
// failed to load and the ground became invisible)
const groundMat = new THREE.MeshBasicMaterial({ color: 0x3a7d3a }); // solid green
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
scene.add(ground);

// Add a subtle checker pattern using a second plane on top (also solid colors)
// This gives some visual variety without relying on texture loading
const checkerGroup = new THREE.Group();
const checkerSize = 100;
const checkerGeo = new THREE.PlaneGeometry(checkerSize, checkerSize);
const checkerMatA = new THREE.MeshBasicMaterial({ color: 0x3a7d3a }); // darker green
const checkerMatB = new THREE.MeshBasicMaterial({ color: 0x4a8a4a }); // lighter green
for (let cx = -1000; cx <= 1000; cx += checkerSize) {
  for (let cz = -1000; cz <= 1000; cz += checkerSize) {
    const mat = ((Math.floor(cx / checkerSize) + Math.floor(cz / checkerSize)) % 2 === 0) ? checkerMatA : checkerMatB;
    const tile = new THREE.Mesh(checkerGeo, mat);
    tile.rotation.x = -Math.PI / 2;
    tile.position.set(cx, 0.05, cz);
    checkerGroup.add(tile);
  }
}
scene.add(checkerGroup);

// ============== Road grid (BRIGHT, WIDE, DENSE - always visible) ==============
const roads = [];
const ROAD_SPACING = 180; // road every 180 units (wide spacing for HUGE roads)
const ROAD_WIDTH = 150;   // MASSIVE roads (was 80 - almost 2x wider!)

// Bright contrasting colors - road is light gray (clearly different
// from green grass), yellow line is bright yellow
const roadMatV = new THREE.MeshBasicMaterial({ color: 0x6b6b6b }); // brighter gray
const roadMatH = new THREE.MeshBasicMaterial({ color: 0x6b6b6b });
const lineMatV = new THREE.MeshBasicMaterial({ color: 0xfde047 }); // bright yellow
const lineMatH = new THREE.MeshBasicMaterial({ color: 0xfde047 });
const edgeMatV = new THREE.MeshBasicMaterial({ color: 0xe5e7eb }); // white edges
const edgeMatH = new THREE.MeshBasicMaterial({ color: 0xe5e7eb });

function makeRoad(x, z, w, h, isVertical) {
  // Main road surface
  const geo = new THREE.PlaneGeometry(w, h);
  const mat = isVertical ? roadMatV : roadMatH;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.3, z);
  scene.add(mesh);
  roads.push({ mesh, baseX: x, baseZ: z, w, h, isVertical });

  // Yellow center line (thicker - 4 units wide)
  if (isVertical) {
    const lineGeo = new THREE.PlaneGeometry(4, h);
    const lineMesh = new THREE.Mesh(lineGeo, lineMatV);
    lineMesh.rotation.x = -Math.PI / 2;
    lineMesh.position.set(x, 0.35, z);
    scene.add(lineMesh);
    roads.push({ mesh: lineMesh, baseX: x, baseZ: z, w: 4, h, isVertical: true });

    // White edge lines on both sides
    const edgeGeo = new THREE.PlaneGeometry(1.5, h);
    const edgeLeft = new THREE.Mesh(edgeGeo, edgeMatV);
    edgeLeft.rotation.x = -Math.PI / 2;
    edgeLeft.position.set(x - w / 2 + 1, 0.35, z);
    scene.add(edgeLeft);
    roads.push({ mesh: edgeLeft, baseX: x - w / 2 + 1, baseZ: z, w: 1.5, h, isVertical: true });

    const edgeRight = new THREE.Mesh(edgeGeo, edgeMatV);
    edgeRight.rotation.x = -Math.PI / 2;
    edgeRight.position.set(x + w / 2 - 1, 0.35, z);
    scene.add(edgeRight);
    roads.push({ mesh: edgeRight, baseX: x + w / 2 - 1, baseZ: z, w: 1.5, h, isVertical: true });
  } else {
    const lineGeo = new THREE.PlaneGeometry(w, 4);
    const lineMesh = new THREE.Mesh(lineGeo, lineMatH);
    lineMesh.rotation.x = -Math.PI / 2;
    lineMesh.position.set(x, 0.35, z);
    scene.add(lineMesh);
    roads.push({ mesh: lineMesh, baseX: x, baseZ: z, w, h: 4, isVertical: false });

    // White edge lines on top/bottom
    const edgeGeo = new THREE.PlaneGeometry(w, 1.5);
    const edgeTop = new THREE.Mesh(edgeGeo, edgeMatH);
    edgeTop.rotation.x = -Math.PI / 2;
    edgeTop.position.set(x, 0.35, z - h / 2 + 1);
    scene.add(edgeTop);
    roads.push({ mesh: edgeTop, baseX: x, baseZ: z - h / 2 + 1, w, h: 1.5, isVertical: false });

// Check if a position is on (or too close to) a road.
// Roads are at multiples of ROAD_SPACING, with width ROAD_WIDTH.
// We add a small buffer so trees/buildings aren't right at road edges.
function isOnRoad(x, z, buffer = 4) {
  const halfWidth = ROAD_WIDTH / 2 + buffer;
  // Distance to nearest vertical road (multiples of ROAD_SPACING on X axis)
  const modX = ((x % ROAD_SPACING) + ROAD_SPACING) % ROAD_SPACING;
  const distX = Math.min(modX, ROAD_SPACING - modX);
  // Distance to nearest horizontal road (multiples of ROAD_SPACING on Z axis)
  const modZ = ((z % ROAD_SPACING) + ROAD_SPACING) % ROAD_SPACING;
  const distZ = Math.min(modZ, ROAD_SPACING - modZ);
  // On a road if too close to either a vertical or horizontal road
  return distX < halfWidth || distZ < halfWidth;
}

    let x, z, tries = 0;
    do {
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 400;
      x = Math.cos(angle) * dist;
      z = Math.sin(angle) * dist;
      tries++;
    } while (isOnRoad(x, z, 5) && tries < 30); // retry until off-road
    if (tries < 30) makeTree(x, z);

  for (let i = 0; i < 40; i++) {
    let x, z, tries = 0;

    } while (isOnRoad(x, z, 3) && tries < 30);

}

    case 2: // Hood - low at front

// ============== Steering wheel control ==============
const wheelEl = document.getElementById('wheel');
const wheelWrap = document.getElementById('wheelWrap');
let wheelDragging = false;
let wheelStartTouchAngle = 0;
let wheelStartRotation = 0;

function getTouchAngle(clientX, clientY) {
  const rect = wheelWrap.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  return Math.atan2(clientY - cy, clientX - cx);
}

function wheelStart(clientX, clientY) {
  wheelDragging = true;
  wheelStartTouchAngle = getTouchAngle(clientX, clientY);
  wheelStartRotation = wheelAngle;
}

function wheelMove(clientX, clientY) {
  if (!wheelDragging) return;
  const currentAngle = getTouchAngle(clientX, clientY);
  let delta = currentAngle - wheelStartTouchAngle;
  while (delta > Math.PI) delta -= 2 * Math.PI;
  while (delta < -Math.PI) delta += 2 * Math.PI;
  wheelTargetAngle = wheelStartRotation + delta;
  // Clamp to ±90 degrees (π/2)
  const maxSteer = Math.PI / 2;
  if (wheelTargetAngle > maxSteer) wheelTargetAngle = maxSteer;
  if (wheelTargetAngle < -maxSteer) wheelTargetAngle = -maxSteer;
}

function wheelEnd() {
  wheelDragging = false;
  wheelTargetAngle = 0; // return to center
}

// Multi-touch pointer events (supports steering while pressing gas/brake)
// Each pointer has a unique ID, so we can track multiple touches at once.
let wheelPointerId = null;

wheelWrap.addEventListener('pointerdown', (e) => {
  // Only track one pointer for the wheel at a time
  if (wheelPointerId !== null) return;
  e.preventDefault();
  wheelPointerId = e.pointerId;
  // Capture this pointer so we keep getting events even if finger
  // moves outside the wheel area
  try { wheelWrap.setPointerCapture(e.pointerId); } catch (err) {}
  wheelStart(e.clientX, e.clientY);
});

wheelWrap.addEventListener('pointermove', (e) => {
  if (e.pointerId !== wheelPointerId) return;
  e.preventDefault();
  wheelMove(e.clientX, e.clientY);
});

const endWheelPointer = (e) => {
  if (e.pointerId !== wheelPointerId) return;
  e.preventDefault();
  wheelPointerId = null;
  try { wheelWrap.releasePointerCapture(e.pointerId); } catch (err) {}
  wheelEnd();
};

wheelWrap.addEventListener('pointerup', endWheelPointer);
wheelWrap.addEventListener('pointercancel', endWheelPointer);
wheelWrap.addEventListener('pointerleave', endWheelPointer);

// Mouse events (desktop) - mouse uses pointer events too, but we keep
// these as backup in case pointer events have issues on desktop
wheelWrap.addEventListener('mousedown', (e) => {
  if (wheelPointerId !== null) return;
  wheelStart(e.clientX, e.clientY);
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (wheelDragging && wheelPointerId === null) wheelMove(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => {
  if (wheelDragging && wheelPointerId === null) wheelEnd();
});

// ============== Pedals ==============
// Use pointer events with capture so each pedal tracks its own touch
// independently. This allows multi-touch: hold gas with one finger
// AND turn the steering wheel with another finger at the same time.
function bindPedal(id, key) {
  const el = document.getElementById(id);
  let pedalPointerId = null;
  const down = (e) => {
    if (pedalPointerId !== null) return;
    e.preventDefault();
    pedalPointerId = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    input[key] = true;
    el.classList.add('pressed');
  };
  const up = (e) => {
    if (e.pointerId !== pedalPointerId) return;
    e.preventDefault();
    pedalPointerId = null;
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
    input[key] = false;
    el.classList.remove('pressed');
  };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
bindPedal('gasBtn', 'gas');
bindPedal('brakeBtn', 'brake');

document.addEventListener('keydown', (e) => {

});

// ============== Reset ==============
function resetCar() {
  carState.x = 0;
  carState.z = 0;
  carState.angle = 0;
  carState.speed = 0;
  carState.steer = 0;
  wheelAngle = 0;
  wheelTargetAngle = 0;
}

// ============== Update physics ==============
function update() {
  // Smooth wheel return + lerp to target
  wheelAngle += (wheelTargetAngle - wheelAngle) * 0.25;
  // Apply rotation to wheel visual
  wheelEl.style.transform = `rotate(${wheelAngle}rad)`;
  // Normalize steering: -1 to 1
  // NEGATED: when wheel turns right (positive angle), we want car to
  // visually turn right. In Three.js coords with camera looking toward
  // +Z, +X is on the LEFT of the screen. So we negate to make
  // right=right visually.
  carState.steer = -wheelAngle / (Math.PI / 2);

  // Acceleration / brake
  if (input.gas) {
    carState.speed += carState.accel;
  } else if (input.brake) {
    if (carState.speed > 0) {
      carState.speed -= carState.brakePower;
      if (carState.speed < 0) carState.speed = 0;
    } else {
      carState.speed -= carState.reverseAccel;
    }
  } else {
    // Friction
    if (carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.friction);
    else if (carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.friction);
  }

  // Clamp speed
  if (carState.speed > carState.maxSpeed) carState.speed = carState.maxSpeed;
  if (carState.speed < -carState.maxSpeed * 0.5) carState.speed = -carState.maxSpeed * 0.5;

  // Steering (only when moving)
  if (Math.abs(carState.speed) > 0.01) {
    const turnFactor = carState.speed / carState.maxSpeed;
    carState.angle += carState.steer * carState.turnSpeed * turnFactor * (carState.speed > 0 ? 1 : -1);
  }

  // Move car
  carState.x += Math.sin(carState.angle) * carState.speed;
  carState.z += Math.cos(carState.angle) * carState.speed;

  // Infinite world: move ground + objects + roads with car if too far
  const WRAP_DIST = 500;
  if (Math.abs(carState.x) > WRAP_DIST || Math.abs(carState.z) > WRAP_DIST) {
    // Car has driven too far from origin. Recenter everything by
    // shifting the world back by the car's position offset, and
    // reset the car to (0, 0). This keeps roads/ground NEAR the car
    // instead of moving them away (which was the previous bug).
    const dx = carState.x;
    const dz = carState.z;

    // Reset car to origin
    carState.x = 0;
    carState.z = 0;

    // Move ground to stay under the car
    ground.position.x -= dx;
    ground.position.z -= dz;

    // Move roads to stay near the car
    roads.forEach(r => {
      r.mesh.position.x -= dx;
      r.mesh.position.z -= dz;
    });

    // Move trees + respawn any that are now too far from car
    // When respawning, keep OFF roads so they don't block driving
    trees.forEach(t => {
      t.position.x -= dx;
      t.position.z -= dz;
      if (Math.abs(t.position.x) > 400 || Math.abs(t.position.z) > 400) {
        let nx, nz, tries = 0;
        do {
          const angle = Math.random() * Math.PI * 2;
          const dist = 200 + Math.random() * 300;
          nx = Math.cos(angle) * dist;
          nz = Math.sin(angle) * dist;
          tries++;
        } while (isOnRoad(nx, nz, 5) && tries < 20);
        t.position.x = nx;
        t.position.z = nz;
      }
    });

    // Move cones + respawn any too far (cones CAN be on roads - they're
    // traffic cones meant to be driven over!)
    cones.forEach(c => {
      c.mesh.position.x -= dx;
      c.mesh.position.z -= dz;
      if (Math.abs(c.mesh.position.x) > 400 || Math.abs(c.mesh.position.z) > 400) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 150 + Math.random() * 300;
        c.mesh.position.x = Math.cos(angle) * dist;
        c.mesh.position.z = Math.sin(angle) * dist;
        c.x = c.mesh.position.x;
        c.z = c.mesh.position.z;
        c.hit = false;
        c.mesh.visible = true;
      }
    });

    // Move buildings + respawn any too far
    // Keep OFF roads so they don't block driving
    buildings.forEach(b => {
      b.position.x -= dx;
      b.position.z -= dz;
      if (Math.abs(b.position.x) > 500 || Math.abs(b.position.z) > 500) {
        let nx, nz, tries = 0;
        do {
          const angle = Math.random() * Math.PI * 2;
          const dist = 250 + Math.random() * 300;
          nx = Math.cos(angle) * dist;
          nz = Math.sin(angle) * dist;
          tries++;
        } while (isOnRoad(nx, nz, 8) && tries < 20);
        b.position.x = nx;
        b.position.z = nz;
      }
    });
  }

  // Cone collection (drive over them = sparkle/hide)
  cones.forEach(c => {
    if (c.hit) return;
    const dx = c.mesh.position.x - carState.x;
    const dz = c.mesh.position.z - carState.z;
    if (Math.hypot(dx, dz) < 2.5) {
      c.hit = true;
      c.mesh.visible = false;
    }
  });

  // Tree/building collision (bounce)
  trees.forEach(t => {
    const dx = t.position.x - carState.x;
    const dz = t.position.z - carState.z;
    if (Math.hypot(dx, dz) < 3) {
      carState.speed = -carState.speed * 0.3;
      carState.x -= Math.sin(carState.angle) * 1.5;
      carState.z -= Math.cos(carState.angle) * 1.5;
    }
  });
  buildings.forEach(b => {
    const dx = b.position.x - carState.x;
    const dz = b.position.z - carState.z;
    if (Math.abs(dx) < 5 && Math.abs(dz) < 5) {
      carState.speed = -carState.speed * 0.4;
      carState.x -= Math.sin(carState.angle) * 2;
      carState.z -= Math.cos(carState.angle) * 2;
    }
  });

  // Update car visual
  carGroup.position.x = carState.x;
  carGroup.position.z = carState.z;
  carGroup.rotation.y = carState.angle;

  // Spin wheels
  const spin = carState.speed * 0.3;
  wheels.forEach(w => { w.rotation.x += spin; });

  // Brake light intensity
  carGroup.children.forEach(child => {
    if (child.material && child.material.emissive && child.material.emissive.getHex() === 0xef4444) {
      child.material.emissiveIntensity = input.brake ? 1.0 : 0.4;
    }
  });

  // Update UI
  document.getElementById('speedNum').textContent = Math.round(Math.abs(carState.speed) * 50);

  // Compass
  const dir = ((carState.angle * 180 / Math.PI) % 360 + 360) % 360;
  let compass = 'N';
  let arrow = '⬆️';
  if (dir > 45 && dir <= 135) { compass = 'E'; arrow = '➡️'; }
  else if (dir > 135 && dir <= 225) { compass = 'S'; arrow = '⬇️'; }
  else if (dir > 225 && dir <= 315) { compass = 'W'; arrow = '⬅️'; }
  document.getElementById('compassDir').textContent = compass;
  document.getElementById('compassArrow').textContent = arrow;
}

  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

  // Car grid - filter by search text
  const searchText = (document.getElementById('carSearch')?.value || '').toLowerCase().trim();
  const filteredCars = CAR_TYPES
    .map((c, i) => ({ car: c, index: i }))
    .filter(({ car }) => {
      if (!searchText) return true;
      return car.name.toLowerCase().includes(searchText) ||
             car.id.toLowerCase().includes(searchText) ||
             car.desc.toLowerCase().includes(searchText);
    });

  const carGrid = document.getElementById('carGrid');
  if (filteredCars.length === 0) {
    carGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 30px;">No cars match your search. Try "honda", "bmw", "suv", "sport", etc.</div>';
  } else {
    carGrid.innerHTML = filteredCars.map(({ car: c, index: i }) => `
      <div class="car-option ${i === currentCarType ? 'selected' : ''}" onpointerdown="selectCar(${i})">
        <div class="preview" style="background: #${c.color.toString(16).padStart(6, '0')}"></div>
        <div class="name">${c.name}</div>
        <div class="stat">${c.desc}</div>
      </div>
    `).join('');
  }

  // Color grid
  const colorGrid = document.getElementById('colorGrid');
  colorGrid.innerHTML = CAR_COLORS.map((col, i) => `
    <div class="color-option ${col === currentColor ? 'selected' : ''}"
         style="background: #${col.toString(16).padStart(6, '0')}"
         onpointerdown="selectColor(${i})"></div>
  `).join('');

  // Tuning grid
  const tuningGrid = document.getElementById('tuningGrid');
  tuningGrid.innerHTML = TUNING_PRESETS.map((t, i) => `
    <div class="tuning-option ${i === currentTuning ? 'selected' : ''}" onpointerdown="selectTuning(${i})">
      <div class="label">${t.name}</div>
      <div class="desc">${t.desc}</div>
    </div>
  `).join('');
}

function selectCar(i) {
  currentCarType = i;
  // Auto-update color to the car's default color when picking a new car
  currentColor = CAR_TYPES[i].color;
  buildGarageUI();
}
function selectColor(i) {
  currentColor = CAR_COLORS[i];
  buildGarageUI();
}
function selectTuning(i) {
  currentTuning = i;
  buildGarageUI();
}

function applyCar() {
  const carType = CAR_TYPES[currentCarType];
  const tuning = TUNING_PRESETS[currentTuning];

  // Apply car stats with tuning multipliers
  carState.maxSpeed = carType.maxSpeed * tuning.maxSpeedMul;
  carState.accel = carType.accel * tuning.accelMul;
  carState.brakePower = carType.brake;
  carState.reverseAccel = carType.accel * 0.4;
  carState.friction = 0.015;

  // Update car visuals: body size + color
  rebuildCarVisuals(carType, currentColor);

  closeGarage();
}

// Rebuild the car mesh with new size and color
function rebuildCarVisuals(carType, color) {
  // Remove old car children
  while (carGroup.children.length > 0) {
    const child = carGroup.children[0];
    carGroup.remove(child);
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
  }
  // Clear wheels array
  wheels.length = 0;

  // Body
  const bodyGeo = new THREE.BoxGeometry(carType.width, 1, carType.length);
  const bodyMat = new THREE.MeshPhongMaterial({ color: color, shininess: 80 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.0;
  body.castShadow = true;
  carGroup.add(body);

  // Cabin
  const cabinW = carType.width * 0.83;
  const cabinL = carType.length * 0.48;
  const cabinGeo = new THREE.BoxGeometry(cabinW, 0.9, cabinL);
  const cabinMat = new THREE.MeshPhongMaterial({ color: carType.cabinColor, shininess: 100 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 1.85, -0.3);
  cabin.castShadow = true;
  carGroup.add(cabin);

  // Windshield
  const windshieldMat = new THREE.MeshPhongMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.6, shininess: 200 });
  const windshield = new THREE.Mesh(new THREE.PlaneGeometry(cabinW * 0.95, 0.8), windshieldMat);
  windshield.position.set(0, 1.85, cabinL / 2);
  windshield.rotation.x = -Math.PI / 2 + 0.5;
  carGroup.add(windshield);

  // Headlights (front)
  [-1, 1].forEach(side => {
    const light = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.3, 0.1),
      new THREE.MeshPhongMaterial({ color: 0xfde68a, emissive: 0xfde68a, emissiveIntensity: 0.5 })
    );
    light.position.set(side * (carType.width / 2 - 0.4), 1.0, carType.length / 2);
    carGroup.add(light);
  });

  // Taillights (back)
  [-1, 1].forEach(side => {
    const light = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.3, 0.1),
      new THREE.MeshPhongMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.4 })
    );
    light.position.set(side * (carType.width / 2 - 0.4), 1.0, -carType.length / 2);
    carGroup.add(light);
  });

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.4, 16);
  const wheelMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
  const w = carType.width;
  const l = carType.length;
  const wheelPositions = [
    [-w/2 - 0.1, 0.6, l/2 - 1.4],
    [w/2 + 0.1, 0.6, l/2 - 1.4],
    [-w/2 - 0.1, 0.6, -l/2 + 1.4],
    [w/2 + 0.1, 0.6, -l/2 + 1.4],
  ];
  wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.position.set(pos[0], pos[1], pos[2]);
    wheel.rotation.z = Math.PI / 2;
    wheel.castShadow = true;
    carGroup.add(wheel);
    wheels.push(wheel);
  });
}

// Initialize car visuals with default car
rebuildCarVisuals(CAR_TYPES[0], CAR_TYPES[0].color);

</script>

</body>
</html>
